# Render blueprint for the HRMS backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo/branch.
databases:
  - name: hrms-db
    databaseName: hrms
    plan: free

services:
  - type: web
    name: hrms-backend
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # Run migrations, bootstrap the admin (and purge any sample employees since
    # SEED_SAMPLE_DATA is unset here), then start the server.
    startCommand: alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      # Replace with your deployed frontend origin (no trailing slash).
      - key: CORS_ORIGINS
        value: '["https://hrms-dev-test.netlify.app","http://localhost:5173"]'
